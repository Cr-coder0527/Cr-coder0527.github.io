<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史上的今天 | Cr的空间</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #3949ab 0%, #00897b 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: #2d3436;
    padding: 20px 12px 40px;
  }
  .page { max-width: 760px; margin: 0 auto; }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    color: #fff; margin-bottom: 16px;
  }
  .back-link {
    color: #fff; text-decoration: none; font-size: 14px;
    background: rgba(255,255,255,.15);
    padding: 7px 14px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.25);
    transition: background .2s;
  }
  .back-link:hover { background: rgba(255,255,255,.28); }
  .page-title { text-align: center; color: #fff; margin-bottom: 18px; }
  .page-title h1 { font-size: 28px; letter-spacing: 3px; text-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .page-title p { font-size: 13px; opacity: .9; margin-top: 6px; letter-spacing: 1px; }

  .control-card {
    background: rgba(255,255,255,.96);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .date-nav { display: flex; align-items: center; gap: 8px; }
  .nav-btn {
    border: none; width: 38px; height: 38px; border-radius: 50%;
    background: #eef1f8; color: #3949ab; font-size: 16px; cursor: pointer;
    transition: background .15s;
  }
  .nav-btn:hover { background: #dde3f5; }
  input[type="date"] {
    border: 1.5px solid #d6dbea; border-radius: 10px;
    padding: 8px 10px; font-size: 15px; color: #3949ab;
    font-family: inherit; background: #fff; outline: none;
  }
  input[type="date"]:focus { border-color: #3949ab; }
  .today-btn {
    border: none; border-radius: 20px; padding: 9px 18px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    color: #fff; background: linear-gradient(135deg, #3949ab, #00897b);
    box-shadow: 0 4px 10px rgba(57,73,171,.3);
  }
  .today-btn:active { transform: scale(.96); }
  .date-tip { margin-left: auto; font-size: 13px; color: #7a8599; }
  .date-tip b { color: #3949ab; font-size: 15px; }

  .tabs {
    display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .tab {
    flex: 1; min-width: 84px;
    border: none; border-radius: 12px 12px 0 0;
    padding: 11px 6px; font-size: 14.5px; font-weight: 600;
    cursor: pointer; color: #fff;
    background: rgba(255,255,255,.22);
    transition: background .2s;
    font-family: inherit;
  }
  .tab .tab-count {
    display: inline-block; min-width: 20px; font-size: 12px;
    background: rgba(255,255,255,.3); border-radius: 10px;
    padding: 1px 6px; margin-left: 4px;
  }
  .tab.active { background: rgba(255,255,255,.96); color: #3949ab; }
  .tab.active .tab-count { background: #3949ab; color: #fff; }

  .list-card {
    background: rgba(255,255,255,.96);
    border-radius: 0 16px 16px 16px;
    padding: 8px 18px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    min-height: 300px;
  }
  .item {
    display: flex; gap: 14px;
    padding: 15px 4px;
    border-bottom: 1px dashed #e2e6f0;
  }
  .item:last-child { border-bottom: none; }
  .year-badge {
    flex-shrink: 0;
    min-width: 62px; height: 30px; padding: 0 8px;
    border-radius: 15px;
    background: linear-gradient(135deg, #3949ab, #5c6bc0);
    color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  .item.birth .year-badge { background: linear-gradient(135deg, #00897b, #26a69a); }
  .item.death .year-badge { background: linear-gradient(135deg, #8d6e63, #a1887f); }
  .item-body { flex: 1; font-size: 14.5px; line-height: 1.75; color: #37474f; }
  .item-body a {
    color: #3949ab; text-decoration: none; font-size: 12.5px;
    margin-left: 6px; white-space: nowrap;
  }
  .item-body a:hover { text-decoration: underline; }

  .state {
    text-align: center; padding: 70px 20px; color: #7a8599;
  }
  .state .icon { font-size: 42px; margin-bottom: 14px; opacity: .55; }
  .state p { font-size: 14.5px; line-height: 1.8; }
  .retry-btn {
    margin-top: 18px; border: none; border-radius: 20px;
    padding: 10px 26px; font-size: 14px; font-weight: 600;
    color: #fff; background: linear-gradient(135deg, #3949ab, #00897b);
    cursor: pointer; box-shadow: 0 4px 10px rgba(57,73,171,.3);
  }
  .spinner {
    width: 38px; height: 38px; margin: 0 auto 16px;
    border: 3.5px solid #d6dbea; border-top-color: #3949ab;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer-note {
    text-align: center; color: rgba(255,255,255,.85);
    font-size: 12px; margin-top: 20px; line-height: 1.8;
  }
  .footer-note a { color: #fff; }
  @media screen and (max-width: 600px) {
    .page-title h1 { font-size: 22px; letter-spacing: 2px; }
    .date-tip { margin-left: 0; width: 100%; }
    .tab { min-width: 70px; font-size: 13.5px; padding: 10px 4px; }
    .item { gap: 10px; }
    .year-badge { min-width: 54px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <a class="back-link" href="/">‹ 回首页</a>
    <a class="back-link" href="/games/feihualing/">🌸 飞花令</a>
  </div>

  <div class="page-title">
    <h1>📜 历史上的今天</h1>
    <p>回望岁月长河，这一天曾发生过什么</p>
  </div>

  <div class="control-card">
    <div class="date-nav">
      <button class="nav-btn" id="prevDay" title="前一天">‹</button>
      <input type="date" id="datePicker">
      <button class="nav-btn" id="nextDay" title="后一天">›</button>
    </div>
    <button class="today-btn" id="todayBtn">回到今天</button>
    <div class="date-tip" id="dateTip"></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="events">大事记<span class="tab-count" id="cnt-events">–</span></button>
    <button class="tab" data-tab="births">出生<span class="tab-count" id="cnt-births">–</span></button>
    <button class="tab" data-tab="deaths">逝世<span class="tab-count" id="cnt-deaths">–</span></button>
    <button class="tab" data-tab="holidays">节日<span class="tab-count" id="cnt-holidays">–</span></button>
  </div>

  <div class="list-card" id="listCard">
    <div class="state">
      <div class="spinner"></div>
      <p>正在翻阅历史长卷…</p>
    </div>
  </div>

  <div class="footer-note">
    数据来源：<a href="https://zh.wikipedia.org/" target="_blank" rel="noopener">维基百科·历史上的今天</a>（Wikimedia 开放接口）
  </div>
</div>

<script>
(function () {
  var CACHE_PREFIX = 'otd_cache_v1_';
  var state = {
    date: new Date(),
    tab: 'events',
    data: null,
    lang: 'zh'
  };

  var picker = document.getElementById('datePicker');
  var listCard = document.getElementById('listCard');
  var dateTip = document.getElementById('dateTip');

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function keyOf(d) { return pad(d.getMonth() + 1) + '/' + pad(d.getDate()); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  function renderDateTip() {
    var weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    var today = new Date();
    var isToday = state.date.getMonth() === today.getMonth() && state.date.getDate() === today.getDate();
    dateTip.innerHTML = (isToday ? '今天是 ' : '所选日期：') +
      '<b>' + (state.date.getMonth() + 1) + '月' + state.date.getDate() + '日</b> ' +
      weekdays[state.date.getDay()];
    picker.value = ymd(state.date);
  }

  function showLoading() {
    listCard.innerHTML = '<div class="state"><div class="spinner"></div><p>正在翻阅历史长卷…</p></div>';
  }
  function showError(msg) {
    listCard.innerHTML =
      '<div class="state"><div class="icon">📭</div><p>' + msg + '</p>' +
      '<button class="retry-btn" onclick="window.__retryOtd()">重新加载</button></div>';
  }

  // 取数据：中文维基优先，为空时回退英文维基；按 MM/DD 永久缓存（史实不变）
  function fetchDay(mmdd) {
    var cached = null;
    try { cached = localStorage.getItem(CACHE_PREFIX + mmdd); } catch (e) {}
    if (cached) {
      return new Promise(function (resolve) {
        setTimeout(function () { resolve(JSON.parse(cached)); }, 0);
      });
    }
    return fetchLang('zh', mmdd).then(function (data) {
      var total = (data.events || []).length + (data.births || []).length +
                  (data.deaths || []).length + (data.holidays || []).length;
      if (total === 0) {
        return fetchLang('en', mmdd).then(function (en) {
          en._lang = 'en';
          return en;
        }).catch(function () { return data; });
      }
      return data;
    }).then(function (data) {
      try { localStorage.setItem(CACHE_PREFIX + mmdd, JSON.stringify(data)); } catch (e) {}
      return data;
    });
  }

  function fetchLang(lang, mmdd) {
    var url = 'https://api.wikimedia.org/feed/v1/wikipedia/' + lang + '/onthisday/all/' + mmdd;
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function wikiLink(pages) {
    try {
      var p = pages && pages[0];
      var u = p && p.content_urls && p.content_urls.desktop && p.content_urls.desktop.page;
      if (u) return ' <a href="' + u + '" target="_blank" rel="noopener">详情 ↗</a>';
    } catch (e) {}
    return '';
  }

  function renderCounts() {
    document.getElementById('cnt-events').textContent = (state.data.events || []).length;
    document.getElementById('cnt-births').textContent = (state.data.births || []).length;
    document.getElementById('cnt-deaths').textContent = (state.data.deaths || []).length;
    document.getElementById('cnt-holidays').textContent = (state.data.holidays || []).length;
  }

  function renderList() {
    var tab = state.tab;
    var items = (state.data[tab] || []).slice();
    items.sort(function (a, b) { return (b.year || 0) - (a.year || 0); });

    if (state.data._lang === 'en') {
      // 英文回退时仅给大事记加一条提示
    }

    if (items.length === 0) {
      var tips = {
        events: '这一天暂无大事记记录',
        births: '这一天暂无出生记录',
        deaths: '这一天暂无逝世记录',
        holidays: '这一天暂无节日记录'
      };
      listCard.innerHTML = '<div class="state"><div class="icon">🗞️</div><p>' +
        tips[tab] + '</p></div>';
      return;
    }

    var cls = tab === 'births' ? 'birth' : (tab === 'deaths' ? 'death' : '');
    var yearText;
    var html = items.map(function (it) {
      if (tab === 'holidays') {
        yearText = '节日';
      } else {
        yearText = (it.year && it.year < 0 ? '前' + Math.abs(it.year) : it.year) + '年';
      }
      return '<div class="item ' + cls + '">' +
        '<div class="year-badge">' + yearText + '</div>' +
        '<div class="item-body">' + escapeHtml(it.text || '') + wikiLink(it.pages) + '</div>' +
        '</div>';
    }).join('');
    listCard.innerHTML = html;
  }

  function load() {
    renderDateTip();
    showLoading();
    var mmdd = keyOf(state.date);
    fetchDay(mmdd).then(function (data) {
      state.data = data;
      renderCounts();
      renderList();
    }).catch(function () {
      showError('历史资料加载失败，可能是网络问题，请稍后重试。');
    });
  }

  window.__retryOtd = function () {
    try { localStorage.removeItem(CACHE_PREFIX + keyOf(state.date)); } catch (e) {}
    load();
  };

  // 日期切换
  function shiftDay(delta) {
    state.date = new Date(state.date.getFullYear(), state.date.getMonth(), state.date.getDate() + delta);
    state.data = null;
    load();
  }
  document.getElementById('prevDay').addEventListener('click', function () { shiftDay(-1); });
  document.getElementById('nextDay').addEventListener('click', function () { shiftDay(1); });
  document.getElementById('todayBtn').addEventListener('click', function () {
    state.date = new Date();
    state.data = null;
    load();
  });
  picker.addEventListener('change', function () {
    if (!picker.value) return;
    var parts = picker.value.split('-');
    state.date = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    state.data = null;
    load();
  });

  // Tab 切换
  document.getElementById('tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
    btn.classList.add('active');
    state.tab = btn.getAttribute('data-tab');
    if (state.data) renderList();
  });

  renderDateTip();
  load();
})();
</script>
</body>
</html>
