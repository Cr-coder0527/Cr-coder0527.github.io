<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匿名提问箱 | Cr的空间</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(165deg, #5c6bc0 0%, #3949ab 45%, #00897b 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: #2d3436;
    overflow-x: hidden;
  }
  /* 漂浮小信封装饰 */
  .float-ico {
    position: fixed; top: -40px; z-index: 0;
    pointer-events: none; opacity: .5;
    animation: floatDown linear infinite;
  }
  @keyframes floatDown {
    0% { transform: translateY(-50px) translateX(0) rotate(-12deg); }
    50% { transform: translateY(55vh) translateX(40px) rotate(10deg); }
    100% { transform: translateY(108vh) translateX(-20px) rotate(-12deg); }
  }
  .app { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 16px 12px 40px; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; color: #fff; margin-bottom: 14px; }
  .back-link {
    color: #fff; text-decoration: none; font-size: 13.5px;
    background: rgba(255,255,255,.16); padding: 7px 14px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.25); transition: background .2s;
  }
  .back-link:hover { background: rgba(255,255,255,.3); }
  .top-hint { font-size: 12px; opacity: .8; letter-spacing: 1px; }

  /* ===== 头部 ===== */
  .hero { text-align: center; color: #fff; margin: 6px 0 16px; }
  .hero .logo { font-size: 50px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.25)); }
  .hero h1 {
    font-size: 30px; letter-spacing: 6px; margin: 10px 0 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,.2);
  }
  .hero .sub { font-size: 13.5px; opacity: .92; letter-spacing: 1.5px; line-height: 1.7; }

  /* ===== 卡片通用 ===== */
  .card {
    background: rgba(255,255,255,.97);
    border-radius: 20px;
    padding: 22px 20px;
    box-shadow: 0 14px 38px rgba(0,0,0,.22);
    margin-bottom: 14px;
  }
  .card-title { font-size: 16px; font-weight: 700; color: #3949ab; letter-spacing: 2px; margin-bottom: 14px; display: flex; align-items: center; gap: 7px; }
  .card-title::before { content: ''; width: 4px; height: 17px; border-radius: 2px; background: linear-gradient(180deg, #3949ab, #00897b); }

  /* ===== 表单 ===== */
  .field { margin-bottom: 13px; }
  .field input, .field textarea {
    width: 100%; border: 1.5px solid #d6dbea; border-radius: 12px;
    padding: 11px 13px; font-size: 15px; outline: none;
    font-family: inherit; color: #2d3436; background: #fbfcff;
    transition: border-color .15s, background .15s;
  }
  .field textarea { resize: vertical; min-height: 110px; line-height: 1.7; }
  .field input:focus, .field textarea:focus { border-color: #3949ab; background: #fff; }
  .field-hint { display: flex; justify-content: space-between; font-size: 12px; color: #9aa3b8; margin-top: 5px; padding: 0 3px; }
  .count.warn { color: #e57373; }
  /* 蜜罐：真人不可见 */
  .hp { position: absolute !important; left: -9999px !important; width: 1px; height: 1px; opacity: 0; }
  .main-btn {
    border: none; border-radius: 26px; padding: 13px 0; width: 100%;
    font-size: 16px; font-weight: 700; letter-spacing: 4px;
    color: #fff; cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, #3949ab, #00897b);
    box-shadow: 0 8px 18px rgba(57,73,171,.35);
    transition: transform .08s, filter .15s, opacity .2s;
  }
  .main-btn:active { transform: scale(.97); filter: brightness(.95); }
  .main-btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }

  .form-msg { display: none; margin-top: 12px; border-radius: 12px; padding: 11px 14px; font-size: 13.5px; line-height: 1.6; }
  .form-msg.ok { display: block; background: #e7f5f1; color: #00796b; border: 1px solid #b2dfdb; }
  .form-msg.err { display: block; background: #fdecea; color: #c62828; border: 1px solid #f5c6c2; }

  /* ===== 博主管理条（隐藏） ===== */
  .admin-bar { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed #cfd6ea; }
  .admin-bar.show { display: block; }
  .admin-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .admin-row input {
    flex: 1; min-width: 130px; border: 1.5px solid #d6dbea; border-radius: 10px;
    padding: 9px 12px; font-size: 13.5px; outline: none; font-family: inherit; background: #fbfcff;
  }
  .admin-row input:focus { border-color: #3949ab; }
  .mini-btn {
    border: none; border-radius: 10px; padding: 9px 16px; font-size: 13px;
    cursor: pointer; font-family: inherit; color: #fff;
    background: linear-gradient(135deg, #5c6bc0, #3949ab);
  }
  .mini-btn.ghost { background: #fff; color: #7a8398; border: 1.5px solid #c8cee0; }
  .admin-status { font-size: 12.5px; color: #00796b; margin-top: 8px; }
  .admin-status .logout { color: #c62828; cursor: pointer; margin-left: 10px; text-decoration: underline; }

  /* ===== 问题墙 ===== */
  .wall-head { display: flex; align-items: center; justify-content: space-between; }
  .wall-stat { font-size: 12px; color: #9aa3b8; letter-spacing: 0; font-weight: 400; }
  .q-item {
    border: 1.5px solid #e6eaf5; border-radius: 16px;
    padding: 15px 16px; margin-bottom: 12px;
    background: #fff; transition: box-shadow .2s, transform .2s;
  }
  .q-item:hover { box-shadow: 0 6px 18px rgba(57,73,171,.1); transform: translateY(-1px); }
  .q-item.pending { background: #fafbfe; border-style: dashed; }
  .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .q-who { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: #3949ab; }
  .q-avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #7986cb, #4db6ac);
    color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .q-when { font-size: 11.5px; color: #a4abc0; }
  .q-badge {
    font-size: 11px; padding: 2px 9px; border-radius: 10px;
    background: #fff3e0; color: #ef6c00; border: 1px solid #ffe0b2;
  }
  .q-badge.done { background: #e7f5f1; color: #00796b; border-color: #b2dfdb; }
  .q-content { font-size: 15px; line-height: 1.8; color: #3a4152; word-break: break-word; }

  .a-box {
    margin-top: 11px; border-radius: 12px; padding: 12px 14px;
    background: linear-gradient(135deg, #f0f4ff, #e8f6f3);
    border-left: 3px solid #00897b;
  }
  .a-head { font-size: 12.5px; font-weight: 700; color: #00796b; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
  .a-when { font-weight: 400; color: #80cbc4; font-size: 11px; margin-left: auto; }
  .a-text { font-size: 14px; line-height: 1.85; color: #35504c; white-space: pre-wrap; word-break: break-word; }
  .pending-tip { margin-top: 9px; font-size: 12.5px; color: #b0a08a; }

  /* 博主回复区 */
  .reply-zone { display: none; margin-top: 11px; }
  body.admin .reply-zone { display: block; }
  .reply-zone textarea {
    width: 100%; min-height: 74px; border: 1.5px solid #b9c5e8; border-radius: 10px;
    padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
    resize: vertical; line-height: 1.7; background: #fcfdff;
  }
  .reply-zone textarea:focus { border-color: #3949ab; }
  .reply-actions { display: flex; gap: 8px; margin-top: 8px; }
  .reply-actions .mini-btn { padding: 8px 18px; font-size: 13px; }

  /* 状态 */
  .state-box { text-align: center; padding: 34px 16px; color: #8a93a8; font-size: 14px; line-height: 2; }
  .state-box .big { font-size: 44px; display: block; margin-bottom: 8px; }
  .retry-btn {
    margin-top: 12px; border: 1.5px solid #b9c2dd; background: #fff; color: #5b6478;
    border-radius: 20px; padding: 8px 22px; font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  .wall-mask { display: none; text-align: center; padding: 26px; color: #9aa3b8; font-size: 13px; }
  .wall-mask.show { display: block; }

  .foot-note { text-align: center; color: rgba(255,255,255,.75); font-size: 12px; line-height: 1.9; margin-top: 8px; letter-spacing: 1px; }

  @media (max-width: 480px) {
    .hero h1 { font-size: 25px; letter-spacing: 4px; }
    .card { padding: 18px 15px; }
    .admin-row input { min-width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <a class="back-link" href="/">← 返回首页</a>
    <span class="top-hint">Cr 的空间 · 匿名提问箱</span>
  </div>

  <div class="hero" id="heroLock">
    <div class="logo">💌</div>
    <h1>匿名提问箱</h1>
  </div>

  <!-- 提问表单 -->
  <div class="card">
    <div class="card-title">投一封信</div>
    <form id="askForm" autocomplete="off">
      <div class="field">
        <input type="text" id="nickname" maxlength="12" placeholder="你的称呼（选填，默认「匿名」）">
      </div>
      <div class="field">
        <textarea id="content" maxlength="500" placeholder="写下你的问题，5 ~ 500 字……"></textarea>
        <div class="field-hint">
          <span>匿名提交，不会记录任何身份信息</span>
          <span class="count" id="count">0 / 500</span>
        </div>
      </div>
      <!-- 蜜罐字段：机器人可见、真人不可见 -->
      <input class="hp" type="text" id="website" tabindex="-1" autocomplete="off">
      <button type="submit" class="main-btn" id="submitBtn">悄悄投出 ✉️</button>
      <div class="form-msg" id="formMsg"></div>
    </form>

    <!-- 隐藏博主入口（连续点击标题 5 次出现） -->
    <div class="admin-bar" id="adminBar">
      <div id="loginBox">
        <div style="font-size:12.5px;color:#8a93a8;margin-bottom:8px;">博主登录（访客无需登录）</div>
        <div class="admin-row">
          <input type="email" id="loginEmail" placeholder="博主邮箱" autocomplete="username">
          <input type="password" id="loginPwd" placeholder="密码" autocomplete="current-password">
          <button class="mini-btn" id="loginBtn">登录回复</button>
        </div>
        <div class="admin-status" id="loginMsg"></div>
      </div>
      <div id="loggedBox" style="display:none;">
        <div class="admin-status" style="margin-top:0;">
          ✅ 博主已登录，可在下方各问题中回复
          <span class="logout" id="logoutBtn">退出登录</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 问题墙 -->
  <div class="card">
    <div class="card-title wall-head">
      <span>📬 提问墙</span>
      <span class="wall-stat" id="wallStat"></span>
    </div>
    <div id="wall"></div>
    <div class="wall-mask" id="wallLoading">正在拆信…</div>
  </div>

  <div class="foot-note">本提问箱由 Supabase 提供数据服务 · 内容公开可见，请勿提交隐私信息</div>
</div>

<script>
/* ================= 配置 ================= */
var SUPA = {
  url: 'https://ubsutakcgwtyxuogtsry.supabase.co',
  key: 'sb_publishable_JTQCuEjuISOf_W0fkJqkpA_edCAwnXa'
};
var TOKEN_KEY = 'ask_owner_token_v1';
var LAST_POST_KEY = 'ask_last_post_v1';
var POST_CNT_KEY = 'ask_post_cnt_v1';

var $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function sbHeaders(extra) {
  var h = { 'apikey': SUPA.key, 'Authorization': 'Bearer ' + SUPA.key, 'Content-Type': 'application/json' };
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}
function ownerHeaders() {
  var h = { 'apikey': SUPA.key, 'Content-Type': 'application/json' };
  var token = localStorage.getItem(TOKEN_KEY);
  h['Authorization'] = 'Bearer ' + (token || SUPA.key);
  return h;
}

/* ================= 时间格式化 ================= */
function fmtTime(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var now = new Date();
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  var sameDay = d.toDateString() === now.toDateString();
  var yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (sameDay) return '今天 ' + hm;
  if (d.toDateString() === yest.toDateString()) return '昨天 ' + hm;
  if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function avatarChar(name) {
  name = (name || '匿').trim();
  return esc(name.charAt(0));
}

/* ================= 问题墙 ================= */
var allQuestions = [];
function sortQuestions(list) {
  // 已回答在前；组内按时间倒序
  return list.slice().sort(function (a, b) {
    var aa = a.answer ? 1 : 0, bb = b.answer ? 1 : 0;
    if (aa !== bb) return bb - aa;
    return new Date(b.created_at) - new Date(a.created_at);
  });
}

function renderWall() {
  var box = $('wall');
  var list = sortQuestions(allQuestions);
  var answered = allQuestions.filter(function (q) { return q.answer; }).length;
  $('wallStat').textContent = allQuestions.length ? ('共 ' + allQuestions.length + ' 封 · 已回复 ' + answered) : '';
  if (list.length === 0) {
    box.innerHTML = '<div class="state-box"><span class="big">🕊️</span>提问箱还空空如也<br>快来投出第一封信吧～</div>';
    return;
  }
  box.innerHTML = list.map(function (q) {
    var done = !!q.answer;
    var html = '<div class="q-item' + (done ? '' : ' pending') + '" data-id="' + esc(q.id) + '">' +
      '<div class="q-meta">' +
        '<div class="q-who"><span class="q-avatar">' + avatarChar(q.nickname) + '</span>' + esc(q.nickname || '匿名') + '</div>' +
        (done
          ? '<span class="q-badge done">已回复</span>'
          : '<span class="q-badge">待回复</span>') +
      '</div>' +
      '<div class="q-content">' + esc(q.content) + '</div>' +
      '<div class="q-meta" style="margin-top:8px;margin-bottom:0;"><span></span><span class="q-when">' + fmtTime(q.created_at) + '</span></div>';
    if (done) {
      html += '<div class="a-box"><div class="a-head">✍️ 林燮的回复<span class="a-when">' + fmtTime(q.answered_at) + '</span></div>' +
        '<div class="a-text">' + esc(q.answer) + '</div></div>';
    } else {
      html += '<div class="pending-tip">🌙 已收到，等待回复中……</div>';
    }
    html += '<div class="reply-zone">' +
      '<textarea class="reply-input" placeholder="' + (done ? '修改回复内容…' : '写下回复…') + '">' + (done ? esc(q.answer) : '') + '</textarea>' +
      '<div class="reply-actions"><button class="mini-btn reply-btn">' + (done ? '更新回复' : '发布回复') + '</button></div>' +
      '</div>';
    html += '</div>';
    return html;
  }).join('');

  // 绑定博主回复按钮
  var btns = box.querySelectorAll('.reply-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', onReply);
  }
}

function loadWall() {
  $('wallLoading').classList.add('show');
  $('wall').innerHTML = '';
  fetch(SUPA.url + '/rest/v1/questions?select=*&order=created_at.desc&limit=100', { headers: sbHeaders() })
    .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(function (rows) {
      allQuestions = rows || [];
      $('wallLoading').classList.remove('show');
      renderWall();
    })
    .catch(function () {
      $('wallLoading').classList.remove('show');
      $('wall').innerHTML = '<div class="state-box"><span class="big">📭</span>信件加载失败，可能是网络开小差了<br><button class="retry-btn" onclick="loadWall()">重新加载</button></div>';
    });
}

/* ================= 提交提问 ================= */
function showMsg(type, html) {
  var m = $('formMsg');
  m.className = 'form-msg ' + type;
  m.innerHTML = html;
}
function hideMsg() { $('formMsg').className = 'form-msg'; }

$('content').addEventListener('input', function () {
  var n = this.value.length;
  var c = $('count');
  c.textContent = n + ' / 500';
  c.className = 'count' + (n > 450 ? ' warn' : '');
});

$('askForm').addEventListener('submit', function (e) {
  e.preventDefault();
  hideMsg();
  var content = $('content').value.trim();
  var nickname = $('nickname').value.trim() || '匿名';
  var honeypot = $('website').value;

  // 蜜罐命中：伪装成功，不真正写入
  if (honeypot) {
    afterPosted();
    return;
  }
  if (content.length < 5) { showMsg('err', '问题至少写 5 个字呀～'); return; }
  if (content.length > 500) { showMsg('err', '问题不能超过 500 字～'); return; }

  // 轻量防刷：30 秒间隔 + 每天 10 条
  var now = Date.now();
  var last = parseInt(localStorage.getItem(LAST_POST_KEY) || '0', 10);
  var dayKey = new Date().toDateString();
  var cntRaw = (localStorage.getItem(POST_CNT_KEY) || '').split('|');
  var cnt = cntRaw[0] === dayKey ? parseInt(cntRaw[1] || '0', 10) : 0;
  if (now - last < 30000) { showMsg('err', '投得太快啦，稍等 ' + Math.ceil((30000 - (now - last)) / 1000) + ' 秒再投～'); return; }
  if (cnt >= 10) { showMsg('err', '今天已经投了 10 封信啦，明天再来吧～'); return; }

  var btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = '投递中…';
  fetch(SUPA.url + '/rest/v1/questions', {
    method: 'POST',
    headers: sbHeaders({ 'Prefer': 'return=minimal' }),
    body: JSON.stringify({ content: content, nickname: nickname })
  }).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    localStorage.setItem(LAST_POST_KEY, String(now));
    localStorage.setItem(POST_CNT_KEY, dayKey + '|' + (cnt + 1));
    afterPosted();
    loadWall();
  }).catch(function () {
    showMsg('err', '投递失败，网络可能开小差了，请稍后重试～');
  }).then(function () {
    btn.disabled = false;
    btn.textContent = '悄悄投出 ✉️';
  });
});

function afterPosted() {
  $('content').value = '';
  $('count').textContent = '0 / 500';
  showMsg('ok', '🎉 投递成功！我会尽快回复，刷新或稍候即可在提问墙看到回复～');
}

/* ================= 隐藏博主入口 ================= */
var clickTimes = [];
$('heroLock').addEventListener('click', function () {
  var now = Date.now();
  clickTimes = clickTimes.filter(function (t) { return now - t < 3000; });
  clickTimes.push(now);
  if (clickTimes.length >= 5) {
    clickTimes = [];
    $('adminBar').classList.add('show');
  }
});

var ownerToken = localStorage.getItem(TOKEN_KEY);
function applyAdmin() {
  document.body.classList.toggle('admin', !!ownerToken);
  $('loginBox').style.display = ownerToken ? 'none' : 'block';
  $('loggedBox').style.display = ownerToken ? 'block' : 'none';
  if (allQuestions.length) renderWall();
}

$('loginBtn').addEventListener('click', function () {
  var email = $('loginEmail').value.trim();
  var pwd = $('loginPwd').value;
  var msg = $('loginMsg');
  if (!email || !pwd) { msg.style.color = '#c62828'; msg.textContent = '请输入邮箱和密码'; return; }
  msg.style.color = '#8a93a8';
  msg.textContent = '登录中…';
  fetch(SUPA.url + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: sbHeaders(),
    body: JSON.stringify({ email: email, password: pwd })
  }).then(function (res) { return res.json().then(function (j) { if (!res.ok) throw new Error(j.msg || j.error_description || '登录失败'); return j; }); })
    .then(function (j) {
      ownerToken = j.access_token;
      localStorage.setItem(TOKEN_KEY, ownerToken);
      msg.textContent = '';
      applyAdmin();
    })
    .catch(function (err) {
      msg.style.color = '#c62828';
      msg.textContent = '登录失败：' + (err.message || '邮箱或密码不正确');
    });
});

$('logoutBtn').addEventListener('click', function () {
  ownerToken = null;
  localStorage.removeItem(TOKEN_KEY);
  applyAdmin();
});

function onReply(e) {
  if (!ownerToken) { alert('登录状态已失效，请重新登录'); return; }
  var item = e.target.closest('.q-item');
  var id = item.getAttribute('data-id');
  var text = item.querySelector('.reply-input').value.trim();
  if (!text) { alert('回复内容不能为空'); return; }
  var btn = e.target;
  btn.disabled = true;
  var old = btn.textContent;
  btn.textContent = '发布中…';
  fetch(SUPA.url + '/rest/v1/questions?id=eq.' + encodeURIComponent(id), {
    method: 'PATCH',
    headers: ownerHeaders(),
    body: JSON.stringify({ answer: text, answered_at: new Date().toISOString() })
  }).then(function (res) {
    if (res.status === 401 || res.status === 403) {
      ownerToken = null;
      localStorage.removeItem(TOKEN_KEY);
      applyAdmin();
      throw new Error('登录已失效，请重新登录');
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    btn.textContent = '已发布 ✓';
    setTimeout(function () { loadWall(); }, 600);
  }).catch(function (err) {
    alert(err.message || '发布失败，请重试');
    btn.disabled = false;
    btn.textContent = old;
  });
}

/* ================= 漂浮装饰 ================= */
(function () {
  var icons = ['✉️', '💌', '🌸', '✨'];
  for (var i = 0; i < 6; i++) {
    var s = document.createElement('span');
    s.className = 'float-ico';
    s.textContent = icons[i % icons.length];
    s.style.left = (8 + i * 16 + Math.random() * 6) + '%';
    s.style.fontSize = (16 + Math.random() * 12) + 'px';
    s.style.animationDuration = (14 + Math.random() * 12) + 's';
    s.style.animationDelay = (-Math.random() * 18) + 's';
    document.body.appendChild(s);
  }
})();

/* ================= 启动 ================= */
applyAdmin();
loadWall();
</script>
